"$schema" = 'https://starship.rs/config-schema.json'

# 左: 場所と git だけ。右: その場で意味のある情報だけが現れる。
format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$character"""

right_format = """
$cmd_duration\
$status\
$jobs\
$python\
$conda\
$nodejs\
$rust\
$golang\
$c\
$lua\
$java\
$kotlin\
$haskell\
$php\
$bun\
$deno\
$swift\
$zig\
$docker_context"""

[username]
style_user = "fg:yellow"
style_root = "bold fg:red"
format = '[$user]($style) '

[hostname]
ssh_only = true
style = "fg:yellow"
format = '[at $hostname]($style) '

[directory]
style = "bold fg:cyan"
read_only = " 󰌾"
read_only_style = "fg:red"
truncation_length = 3
truncation_symbol = "…/"
format = '[$path]($style)[$read_only]($read_only_style) '

[git_branch]
style = "fg:white"
format = '[$branch]($style) '

[git_state]
style = "fg:yellow"
format = '[\($state( $progress_current/$progress_total)\)]($style) '

# 種類ごとの件数を出す。変更がなければ何も出ない
[git_status]
style = "fg:yellow"
format = '([$all_status$ahead_behind]($style) )'
conflicted = '=${count}'
stashed = '≡${count}'
deleted = '✘${count}'
renamed = '»${count}'
modified = '!${count}'
staged = '+${count}'
untracked = '?${count}'
ahead = '⇡${count}'
behind = '⇣${count}'
diverged = '⇡${ahead_count}⇣${behind_count}'

[character]
success_symbol = '[❯](bold fg:purple)'
error_symbol = '[✗ ❯](bold fg:red)'
vimcmd_symbol = '[](bold fg:green)'
vimcmd_replace_one_symbol = '[](bold fg:cyan)'
vimcmd_replace_symbol = '[](bold fg:cyan)'
vimcmd_visual_symbol = '[](bold fg:yellow)'

# 2 秒以上かかったコマンドだけ
[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = '[$duration]($style) '

# 失敗したときだけ終了コードを出す
[status]
disabled = false
style = "fg:red"
format = '[✘ $status( $signal_name)]($style) '

[jobs]
style = "fg:blue"
format = '[$symbol$number]($style) '

[nodejs]
symbol = ""
style = "fg:bright-black"
format = '[$symbol( $version)]($style) '
version_format = '${major}.${minor}'

[c]
symbol = ""
style = "fg:bright-black"
format = '[$symbol( $name $version)]($style) '
version_format = '${major}.${minor}'

# [cpp]
# symbol = ""
# style = ""
# format = '[[ $symbol( $name $version) ](fg:text)]($style)'
# disabled = false

